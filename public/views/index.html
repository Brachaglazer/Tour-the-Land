<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="../css/styles.css">

    <link rel="stylesheet" href="css/meanmenu.min.css" type="text/css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/responsiveslides.css">
    <script src="js/responsiveslides.min.js"></script>
    <script>
      $(function() {
        $(".rslides").responsiveSlides({
          auto: true,
          pager: true,
          nav: true,
          speed: 700,
          timeout: 4000,
          maxwidth: 800,
          namespace: "rslides"
        });
      });

      
    </script>
</head>
<body>

<header class="top-bar">
  <nav id="navigation" class="navbar" aria-label="Main navigation">

    <h2 class="logo">Explore the Land</h2>

    <ul class="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="reviews.html">Reviews</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="login.html" onclick="logoutUser()">Logout</a></li>
    </ul>

  </nav>
</header>


<div class="page">

  <ul class="rslides">
      <li><img src="/images/slide1.jpg" alt="Review Slide"></li>
      <li><img src="/images/slide2.jpg" alt="Try Us Slide"></li>
      <li><img src="/images/slide3.jpg" alt="Message Slide"></li>
  </ul>

    <h1>Explore the Land</h1>
    <h2>See Eretz Yisroel Like Never Before!</h2>
    <a class="btn btn-center" href="reviews.html">Read Reviews</a>
</div>



<footer>
  <a href="contact.html">Contact Us</a>
</footer>

<script src="../js/script.js"></script>
<script src="js/jquery.meanmenu.min.js"></script>

<script>
jQuery(document).ready(function () {
    jQuery('#navigation').meanmenu({
        meanScreenWidth: 800,
        meanMenuContainer: 'header.top-bar',
        meanMenuClose: "✕ Close",
        meanMenuOpen: "☰ Menu",
        meanRevealPosition: "right",
        meanRevealColour: "#333",
        meanNavPush: "0"
    });
});
</script>
</body>
</html>
