<!DOCTYPE html>
<html>
<head>
    <title>Trips - Explore the Land</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/meanmenu.min.css">
    <link rel="stylesheet" href="/css/menu.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../js/jquery.meanmenu.min.js"></script>
    <script src="../js/components.js"></script>
</head>
<body>

<div id="navbar"></div>

<div class="container">
  <h1>Your Trips</h1>
  <p class="intro">View your previous trips or start planning a new one!</p>

  <div class="trips-layout">
    <aside class="trip-sidebar">
      <div class="sidebar-header">
        <h2>Trip Library</h2>
        <p class="sidebar-text">Search your saved itineraries and jump directly to the trip details.</p>
        <input id="tripSearch" type="search" placeholder="Search trips..." aria-label="Search trips">
      </div>
      <div id="tripNavList" class="trip-nav-list">
        <p class="no-trips">Loading your trips…</p>
      </div>
    </aside>

    <main class="trips-main">
      <section class="form" aria-labelledby="review-form-heading">
        <h2 id="trip-form-heading">Add a Trip</h2>

        <button type="button" class="btn" onclick="openSampleTripsModal()">Not sure where to start? Choose from our samples!</button>

    <label for="tripLocation">Location</label>
    <p id="locationBox">
      <input type="text" id="tripLocation" placeholder="City name">  
      <img onclick="showWeather()" id="weatherIcon" src="/images/weather-svgrepo-com.png" alt="weather">
    </p>
    <label for="tripDesc">Description</label>
    <textarea id="tripDesc" placeholder="Your notes"></textarea>
    
    <label for="tripStart">Start Date</label>
    <input type="date" id="tripStart">

    <label for="tripEnd">End Date</label>
    <input type="date" id="tripEnd">

    <button onclick="addTrip()">Add Trip</button>
    <div id="trip-feedback" class="response-message" aria-live="polite"></div>

  </section>

  <section id="trips-section">
    <h2>My Trips</h2>
    <div id="tripsList"></div>
  </section>
    </main>
  </div>
</div>
<div id="weatherModalOverlay">
  <div id="weatherModal"></div>
</div>
<div id="tripModalOverlay" class="hide">
  <div id="tripModal" class="modal-card"></div>
</div>

<script src="/js/sampleTrips.js"></script>
<script src="../js/script.js"></script>
</body>
</html>
